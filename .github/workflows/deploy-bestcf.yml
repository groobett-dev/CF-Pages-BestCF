name: Sync Upstream and Deploy BestCF Worker

on:
  schedule:
    # 每天定时自动检查上游更新 (UTC 02:00 / 北京时间 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with Upstream
        id: sync
        run: |
          git remote add upstream https://github.com/cmliu/CF-Pages-BestCF.git || true
          git fetch upstream main
          
          UPSTREAM_HASH=$(git rev-parse upstream/main)
          LOCAL_HASH=$(git rev-parse HEAD)
          echo "Upstream commit: $UPSTREAM_HASH"
          echo "Local commit: $LOCAL_HASH"
          
          # 尝试合并上游最新更新，保留本仓库自定义配置
          git merge -X ours upstream/main -m "chore(sync): auto sync with upstream cmliu/CF-Pages-BestCF" || true
          
          if [ -n "$(git status --porcelain)" ]; then
            git push origin main || true
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Build Static Worker
        run: python3 build_worker.py

      - name: Create wrangler.toml
        run: |
          cat << 'EOF' > wrangler.toml
          name = "bestcf-worker"
          main = "worker.js"
          compatibility_date = "2026-01-20"

          [[kv_namespaces]]
          binding = "KV"
          id = "24eae01689cd41da90c1a19b7c87a440"


          [[routes]]
          pattern = "b.205.dpdns.org"
          custom_domain = true
          zone_name = "205.dpdns.org"

          EOF

      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --minify