name: Sync Upstream and Deploy BestCF Worker

on:
  schedule:
    # 每天定时自动检查上游更新 (UTC 02:00 / 北京时间 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with Upstream
        id: sync
        run: |
          git remote add upstream https://github.com/cmliu/CF-Pages-BestCF.git || true
          git fetch upstream main
          
          UPSTREAM_HASH=$(git rev-parse upstream/main)
          LOCAL_HASH=$(git rev-parse HEAD)
          echo "Upstream commit: $UPSTREAM_HASH"
          echo "Local commit: $LOCAL_HASH"
          
          # 尝试合并上游最新更新，保留本仓库自定义配置
          git merge -X ours upstream/main -m "chore(sync): auto sync with upstream cmliu/CF-Pages-BestCF" || true
          
          if [ -n "$(git status --porcelain)" ]; then
            git push origin main || true
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Build Static Worker
        run: |
          python3 - << 'PYEOF'
          import json, os

          files = ['cf_domains.txt', 'index.html', 'script.js', 'style.css']
          file_contents = {}
          for f in files:
              if os.path.exists(f):
                  with open(f, 'r', encoding='utf-8') as fp:
                      file_contents[f] = fp.read()

          js_builder = 'const STATIC_FILES = {\n'
          for fname, content in file_contents.items():
              mime = 'text/plain; charset=utf-8'
              if fname.endswith('.html'): mime = 'text/html; charset=utf-8'
              elif fname.endswith('.css'): mime = 'text/css; charset=utf-8'
              elif fname.endswith('.js'): mime = 'application/javascript; charset=utf-8'
              key_str = json.dumps('/' + fname)
              val_str = json.dumps(content)
              js_builder += f'  {key_str}: {{\n'
              js_builder += f'    content: {val_str},\n'
              js_builder += f'    type: "{mime}"\n'
              js_builder += '  },\n'

          js_builder += '''};

          const REQUIRED_ADMIN_TOKEN = "128a0301-d962-44d7-a735-6523641fccb0";

          export default {
            async fetch(request, env, ctx) {
              const url = new URL(request.url);
              let pathname = url.pathname;

              const headers = {
                'Access-Control-Allow-Origin': '*',
                'Access-Control-Allow-Methods': 'GET, POST, HEAD, OPTIONS',
                'Access-Control-Allow-Headers': 'Content-Type, X-Admin-Token',
                'Access-Control-Expose-Headers': 'Content-Length, Content-Type',
                'Access-Control-Max-Age': '86400',
                'Content-Security-Policy': 'frame-ancestors *',
                'Cross-Origin-Resource-Policy': 'cross-origin'
              };

              if (request.method === 'OPTIONS') {
                return new Response(null, { headers });
              }

              // 写入到 TXT API: 覆盖写入到 KV ym2026.txt (全新内容，不追加)
              // 关键安全验证：必须携带正确的 admin token 才能写入，防止被他人恶意覆盖
              if (request.method === 'POST' && (pathname === '/api/save_ym' || pathname === '/ym2026.txt' || pathname === '/ym.txt')) {
                const tokenParam = url.searchParams.get('token') || url.searchParams.get('admin');
                const headerToken = request.headers.get('X-Admin-Token');
                const clientToken = tokenParam || headerToken;

                if (clientToken !== REQUIRED_ADMIN_TOKEN) {
                  return new Response(JSON.stringify({
                    success: false,
                    error: 'Forbidden: Invalid or missing admin auth token'
                  }), {
                    status: 403,
                    headers: { ...headers, 'Content-Type': 'application/json; charset=utf-8' }
                  });
                }

                try {
                  const bodyText = await request.text();
                  if (env.KV) {
                    await env.KV.put('ym2026.txt', bodyText);
                  }
                  return new Response(JSON.stringify({
                    success: true,
                    count: bodyText.split(/\r?\n/).filter(Boolean).length,
                    message: 'Successfully written to ym2026.txt'
                  }), {
                    headers: { ...headers, 'Content-Type': 'application/json; charset=utf-8' }
                  });
                } catch (err) {
                  return new Response(JSON.stringify({ success: false, error: err.message }), {
                    status: 500,
                    headers: { ...headers, 'Content-Type': 'application/json; charset=utf-8' }
                  });
                }
              }

              // 读取 /ym2026.txt 或 /ym.txt (完全公开无阻，用于节点订阅拉取)
              if (pathname === '/ym2026.txt' || pathname === '/ym.txt') {
                let data = '';
                if (env.KV) {
                  data = (await env.KV.get('ym2026.txt')) || '';
                }
                return new Response(data, {
                  headers: {
                    ...headers,
                    'Content-Type': 'text/plain; charset=utf-8',
                    'Cache-Control': 'no-cache, no-store, must-revalidate'
                  }
                });
              }

              // 首页路由
              if (pathname === '/' || pathname === '') {
                pathname = '/index.html';
              }

              const file = STATIC_FILES[pathname];
              if (file) {
                headers['Content-Type'] = file.type;
                headers['Cache-Control'] = 'public, max-age=3600';
                return new Response(file.content, { headers });
              }

              return new Response('Not Found', { status: 404, headers });
            }
          };
          '''

          with open('worker.js', 'w', encoding='utf-8') as fp:
              fp.write(js_builder)

          print(f'Successfully built worker.js, size: {len(js_builder)} bytes')
          PYEOF

      - name: Create wrangler.toml
        run: |
          cat << 'EOF' > wrangler.toml
          name = "bestcf-worker"
          main = "worker.js"
          compatibility_date = "2026-01-20"

          [[kv_namespaces]]
          binding = "KV"
          id = "24eae01689cd41da90c1a19b7c87a440"

          [[routes]]
          pattern = "BestCF.205.dpdns.org"
          custom_domain = true
          zone_name = "205.dpdns.org"
          EOF

      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --minify
